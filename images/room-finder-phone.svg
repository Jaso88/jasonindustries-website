<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 820">
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a4252"/><stop offset="0.5" stop-color="#1b2029"/><stop offset="1" stop-color="#2e3542"/>
    </linearGradient>
    <clipPath id="screen"><rect x="16" y="16" width="368" height="788" rx="44"/></clipPath>
    <pattern id="paper" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#efe7d6"/><circle cx="1" cy="1" r="0.5" fill="#e2d8c3"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- body -->
  <rect x="0" y="0" width="400" height="820" rx="58" fill="url(#frame)"/>
  <rect x="6" y="6" width="388" height="808" rx="52" fill="#0a0d12"/>
  <g clip-path="url(#screen)">
    <rect x="16" y="16" width="368" height="788" fill="#0f1624"/>
    <!-- app top bar -->
    <rect x="16" y="16" width="368" height="118" fill="#101a2b"/>
    <text x="44" y="96" font-family="Inter Display" font-weight="800" font-size="25" fill="#fff">Room Finder</text>
    <rect x="262" y="72" width="98" height="34" rx="17" fill="#ff7a1a"/>
    <text x="311" y="95" text-anchor="middle" font-family="Inter" font-weight="700" font-size="16" fill="#1a0e02">Room C14</text>

    <!-- photographed map -->
    <g transform="translate(16 134)">
      <rect width="368" height="540" fill="url(#paper)"/>
      <!-- roads -->
      <rect x="0" y="470" width="368" height="34" fill="#bdb6a6"/>
      <rect x="168" y="0" width="30" height="504" fill="#bdb6a6"/>
      <!-- footpaths -->
      <g fill="#d9cfb9" stroke="#c9bea6" stroke-width="1">
        <rect x="18" y="140" width="150" height="14"/>
        <rect x="198" y="140" width="152" height="14"/>
        <rect x="18" y="290" width="150" height="14"/>
        <rect x="198" y="290" width="152" height="14"/>
        <rect x="90" y="20" width="14" height="450"/>
        <rect x="270" y="20" width="14" height="450"/>
      </g>
      <!-- donga blocks -->
      <g fill="#8fa3b8" stroke="#6d8196" stroke-width="1.5">
        <rect x="22" y="30" width="62" height="100" rx="3"/><rect x="110" y="30" width="50" height="100" rx="3"/>
        <rect x="206" y="30" width="58" height="100" rx="3"/><rect x="290" y="30" width="58" height="100" rx="3"/>
        <rect x="22" y="166" width="62" height="114" rx="3"/><rect x="110" y="166" width="50" height="114" rx="3"/>
        <rect x="206" y="166" width="58" height="114" rx="3"/><rect x="290" y="166" width="58" height="114" rx="3"/>
        <rect x="22" y="316" width="62" height="70" rx="3"/>
        <rect x="290" y="316" width="58" height="70" rx="3"/>
      </g>
      <!-- amenities -->
      <rect x="110" y="316" width="50" height="140" rx="3" fill="#c98f5a" stroke="#a87444" stroke-width="1.5"/>
      <rect x="206" y="316" width="58" height="140" rx="3" fill="#7aa36b" stroke="#5f8752" stroke-width="1.5"/>
      <rect x="22" y="400" width="62" height="56" rx="3" fill="#b9a4d0" stroke="#9a84b4" stroke-width="1.5"/>
      <rect x="290" y="400" width="58" height="56" rx="3" fill="#c9c06a" stroke="#aaa14f" stroke-width="1.5"/>
      <g font-family="Inter" font-weight="700" font-size="13" fill="#24303e" text-anchor="middle">
        <text x="53" y="85">A</text><text x="135" y="85">B</text><text x="235" y="85">C</text><text x="319" y="85">D</text>
        <text x="53" y="228">E</text><text x="135" y="228">F</text><text x="235" y="228">G</text><text x="319" y="228">H</text>
        <text x="135" y="390" font-size="11">MESS</text><text x="235" y="390" font-size="11">GYM</text>
        <text x="53" y="432" font-size="10">LAUNDRY</text><text x="319" y="432" font-size="10">OFFICE</text>
      </g>
      <text x="95" y="492" text-anchor="middle" font-family="Inter" font-weight="700" font-size="11" fill="#5d574b" letter-spacing="2">MAIN GATE</text>
      <!-- route: gate -> up main road -> left onto top path -> to block C -->
      <path d="M183 487 L183 147 L240 147 L240 128" fill="none" stroke="#ff7a1a" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.28"/>
      <path d="M183 487 L183 147 L240 147 L240 128" fill="none" stroke="#ff7a1a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1 12"/>
      <path d="M183 487 L183 147 L240 147" fill="none" stroke="#ff7a1a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- you are here -->
      <circle cx="183" cy="487" r="22" fill="#22c55e" opacity="0.25"/>
      <circle cx="183" cy="487" r="12" fill="#22c55e" stroke="#fff" stroke-width="4"/>
      <!-- room pin -->
      <g transform="translate(240 112)" filter="url(#glow)">
        <path d="M0 18 C-14 2 -16 -6 -16 -12 A16 16 0 0 1 16 -12 C16 -6 14 2 0 18Z" fill="#ff7a1a" stroke="#fff" stroke-width="3"/>
        <circle cx="0" cy="-12" r="6" fill="#fff"/>
      </g>
    </g>

    <!-- bottom controls -->
    <rect x="16" y="674" width="368" height="130" fill="#101a2b"/>
    <g font-family="Inter" font-weight="700" font-size="14" text-anchor="middle">
      <rect x="34" y="694" width="96" height="48" rx="14" fill="#1c2a40"/>
      <circle cx="56" cy="718" r="7" fill="#22c55e"/><text x="92" y="723" fill="#fff">You here</text>
      <rect x="140" y="694" width="96" height="48" rx="14" fill="#1c2a40"/>
      <path d="M160 727 C153 719 152 715 152 712 A8 8 0 0 1 168 712 C168 715 167 719 160 727Z" fill="#ff7a1a"/><text x="200" y="723" fill="#fff">My room</text>
      <rect x="246" y="694" width="120" height="48" rx="14" fill="#ff7a1a"/>
      <text x="306" y="723" fill="#1a0e02">Auto Route</text>
    </g>
    <rect x="160" y="770" width="80" height="5" rx="2.5" fill="#3b4658"/>
    <!-- torch button -->
    <circle cx="340" cy="628" r="26" fill="#101a2b" stroke="#ffd166" stroke-width="2.5"/>
    <path d="M333 615 h14 l-3 9 v15 a4 4 0 0 1 -8 0 v-15z" fill="#ffd166"/>
  </g>
  <!-- camera notch -->
  <rect x="160" y="28" width="80" height="24" rx="12" fill="#05070a"/>
</svg>
